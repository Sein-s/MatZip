<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맛집 지도 - 첨단 와이어스 파크 중심</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body { display:flex; margin:0; }
    #sidebar{
      width:300px; height:100vh; overflow-y:auto;
      background:#f8f9fa; padding:10px; box-sizing:border-box;
      border-right:1px solid #ddd;
    }
    #map{ flex-grow:1; height:100vh; }

    .btn{
      width:100%; padding:10px; margin-bottom:8px;
      border:none; cursor:pointer; font-size:14px; border-radius:6px;
    }
    .btn-pick{ background:#2e7d32; color:#fff; }
    .btn-addr{ background:#1976d2; color:#fff; }

    .hint{
      margin:8px 0 12px;
      font-size:12px; color:#555; line-height:1.4;
    }
    .hint b{ color:#1976d2; }

    .restaurant{
      cursor:pointer; margin-bottom:10px; padding:8px;
      border-bottom:1px solid #e0e0e0;
    }
    .restaurant b{ display:block; }
  </style>
</head>
<body>
  <div id="sidebar">
    <button class="btn btn-pick" id="pickBtn">📍 지도에서 찍어서 추가</button>
    <button class="btn btn-addr" id="addrBtn">🏠 주소 입력으로 추가</button>

    <div class="hint" id="hint">
      원하는 방식 선택:
      <br>• <b>지도에서 찍기</b>: 버튼 누르고 지도 클릭
      <br>• <b>주소 입력</b>: 주소를 입력하면 자동으로 좌표를 찾아요
    </div>

    <h3>맛집 리스트</h3>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // 🔹 초기 장소 리스트 비워둠
    const restaurants = [];

    // 📍 첨단 와이어스 파크 근처 중심 좌표
    const centerLat = 35.2224405;
    const centerLon = 126.8517018;

    const map = L.map("map").setView([centerLat, centerLon], 15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    const sidebar = document.getElementById("sidebar");
    const pickBtn = document.getElementById("pickBtn");
    const addrBtn = document.getElementById("addrBtn");
    const hint = document.getElementById("hint");

    // 중심 마커
    L.marker([centerLat, centerLon]).bindPopup("<b>첨단 와이어스 파크</b>").addTo(map);

    // ✅ 모드 상태
    let isPickMode = false;
    let pendingPin = null;

    function renderRestaurant(restaurant) {
      const marker = L.circleMarker([restaurant.lat, restaurant.lon], {
        radius: 8,
        fillColor: "#ff0000",
        color: "#000",
        weight: 1,
        opacity: 1,
        fillOpacity: 0.8,
      })
        .bindPopup(
          `<b>${escapeHtml(restaurant.name)}</b><br>${escapeHtml(restaurant.menu)}`
          + (restaurant.address ? `<br><small>${escapeHtml(restaurant.address)}</small>` : "")
        )
        .addTo(map);

      const div = document.createElement("div");
      div.className = "restaurant";
      div.innerHTML =
        `<b>${escapeHtml(restaurant.name)}</b>` +
        `<div>${escapeHtml(restaurant.menu)}</div>` +
        (restaurant.address ? `<div style="font-size:12px;color:#666;">${escapeHtml(restaurant.address)}</div>` : "");

      div.addEventListener("click", () => {
        map.setView([restaurant.lat, restaurant.lon], 16);
        marker.openPopup();
      });

      sidebar.appendChild(div);
    }

    function addRestaurantObject(obj) {
      restaurants.push(obj);
      renderRestaurant(obj);
      map.setView([obj.lat, obj.lon], 16);
    }

    function resetPickModeUI() {
      isPickMode = false;
      pickBtn.textContent = "📍 지도에서 찍어서 추가";
      hint.innerHTML =
        `원하는 방식 선택:
        <br>• <b>지도에서 찍기</b>: 버튼 누르고 지도 클릭
        <br>• <b>주소 입력</b>: 주소를 입력하면 자동으로 좌표를 찾아요`;
      if (pendingPin) {
        map.removeLayer(pendingPin);
        pendingPin = null;
      }
    }

    // 1) 지도에서 찍기 버튼
    pickBtn.addEventListener("click", () => {
      isPickMode = !isPickMode;

      if (isPickMode) {
        pickBtn.textContent = "✅ 찍는 중... (다시 누르면 취소)";
        hint.innerHTML = "지도를 클릭하면 좌표가 자동으로 입력돼요. <b>원하는 위치를 클릭</b>하세요.";
      } else {
        resetPickModeUI();
      }
    });

    // 지도 클릭 이벤트 (Pick mode일 때만)
    map.on("click", (e) => {
      if (!isPickMode) return;

      const lat = Number(e.latlng.lat.toFixed(6));
      const lon = Number(e.latlng.lng.toFixed(6));

      if (pendingPin) map.removeLayer(pendingPin);
      pendingPin = L.marker([lat, lon]).addTo(map).bindPopup(`선택 좌표<br>${lat}, ${lon}`).openPopup();

      const name = prompt(`가게 이름을 입력하세요\n(좌표: ${lat}, ${lon})`);
      if (!name) return;

      const menu = prompt("메뉴 / 메모를 입력하세요") || "";
      const address = prompt("주소(선택) - 안 적어도 됨") || "";

      addRestaurantObject({ name, menu, address, lat, lon });
      resetPickModeUI();
    });

    // 2) 주소 입력으로 추가 버튼
    addrBtn.addEventListener("click", async () => {
      const address = prompt("가게 주소를 입력하세요 (예: 광주 북구 첨단과기로 208번길 ...)");
      if (!address) return;

      // 지오코딩 (OpenStreetMap Nominatim)
      // 참고: 너무 자주 호출하면 제한될 수 있어. 개인/소규모 사용에 적합.
      const url =
        "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
        encodeURIComponent(address);

      hint.textContent = "주소로 좌표 찾는 중...";

      try {
        const res = await fetch(url, {
          headers: {
            // Nominatim은 User-Agent/Referer 권장 (브라우저에선 제한적이라 최소한의 header만)
            "Accept": "application/json"
          }
        });

        if (!res.ok) throw new Error("지오코딩 요청 실패");

        const data = await res.json();
        if (!data || data.length === 0) {
          alert("해당 주소로 좌표를 찾지 못했어요. 주소를 더 정확히 적어주세요.");
          resetPickModeUI();
          return;
        }

        const lat = Number(Number(data[0].lat).toFixed(6));
        const lon = Number(Number(data[0].lon).toFixed(6));

        // 위치 미리보기 (선택)
        if (pendingPin) map.removeLayer(pendingPin);
        pendingPin = L.marker([lat, lon]).addTo(map).bindPopup(`검색 위치<br>${lat}, ${lon}`).openPopup();
        map.setView([lat, lon], 16);

        const name = prompt("가게 이름을 입력하세요");
        if (!name) {
          // 이름 취소 시 미리보기 핀 제거
          if (pendingPin) { map.removeLayer(pendingPin); pendingPin = null; }
          resetPickModeUI();
          return;
        }

        const menu = prompt("메뉴 / 메모를 입력하세요") || "";

        addRestaurantObject({ name, menu, address, lat, lon });

        // 미리보기 핀 제거
        if (pendingPin) { map.removeLayer(pendingPin); pendingPin = null; }
        resetPickModeUI();

      } catch (err) {
        console.error(err);
        alert("주소 검색 중 오류가 발생했어요. 잠시 후 다시 시도해 주세요.");
        resetPickModeUI();
      }
    });

    // XSS 방지용 최소 escape
    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
