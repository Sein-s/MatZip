<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맛집 지도 - 첨단 와이어스 파크 중심</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body { display:flex; margin:0; }
    #sidebar {
      width: 300px; height: 100vh; overflow-y:auto;
      background:#f8f9fa; padding:10px; box-sizing:border-box;
    }
    #map { flex-grow:1; height:100vh; }

    .restaurant { cursor:pointer; margin-bottom:10px; padding:6px; border-bottom:1px solid #ddd; }
    .add-btn {
      width:100%; padding:8px; margin-bottom:10px;
      background:#1976d2; color:#fff; border:none; cursor:pointer;
      font-size:14px;
    }
    .hint {
      margin: 8px 0 12px;
      font-size: 12px;
      color: #555;
      line-height: 1.4;
    }
    .hint b { color: #1976d2; }
  </style>
</head>
<body>
  <div id="sidebar">
    <button class="add-btn" id="addBtn">➕ 맛집 추가</button>
    <div class="hint" id="hint">
      버튼을 누르면 <b>지도 클릭</b>으로 좌표를 찍을 수 있어요.
    </div>
    <h3>맛집 리스트</h3>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const restaurants = [];

    // 📍 첨단 와이어스 파크 근처 중심 좌표
    const centerLat = 35.2224405;
    const centerLon = 126.8517018;

    const map = L.map("map").setView([centerLat, centerLon], 15);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    const sidebar = document.getElementById("sidebar");
    const addBtn = document.getElementById("addBtn");
    const hint = document.getElementById("hint");

    // 중심 마커
    L.marker([centerLat, centerLon]).bindPopup("<b>첨단 와이어스 파크</b>").addTo(map);

    // ✅ “추가 모드” 상태
    let isAddMode = false;
    // ✅ 클릭한 좌표를 잠깐 표시하는 핀(미리보기)
    let pendingPin = null;

    function renderRestaurant(restaurant) {
      const marker = L.circleMarker([restaurant.lat, restaurant.lon], {
        radius: 8,
        fillColor: "#ff0000",
        color: "#000",
        weight: 1,
        opacity: 1,
        fillOpacity: 0.8,
      })
        .bindPopup(`<b>${restaurant.name}</b><br>${restaurant.menu}`)
        .addTo(map);

      const div = document.createElement("div");
      div.className = "restaurant";
      div.innerHTML = `<b>${restaurant.name}</b><br>${restaurant.menu}`;

      div.addEventListener("click", () => {
        map.setView([restaurant.lat, restaurant.lon], 16);
        marker.openPopup();
      });

      sidebar.appendChild(div);
    }

    // ➕ 버튼 클릭 시: “지도 클릭해서 좌표 찍기” 모드 ON/OFF
    addBtn.addEventListener("click", () => {
      isAddMode = !isAddMode;

      if (isAddMode) {
        addBtn.textContent = "📍 지도에서 위치 찍는 중... (취소하려면 다시 클릭)";
        addBtn.style.background = "#2e7d32";
        hint.innerHTML = "지도를 클릭하면 좌표가 자동으로 입력돼요. <b>원하는 위치를 클릭</b>하세요.";
      } else {
        addBtn.textContent = "➕ 맛집 추가";
        addBtn.style.background = "#1976d2";
        hint.innerHTML = "버튼을 누르면 <b>지도 클릭</b>으로 좌표를 찍을 수 있어요.";
        if (pendingPin) {
          map.removeLayer(pendingPin);
          pendingPin = null;
        }
      }
    });

    // ✅ 지도 클릭 이벤트: AddMode일 때만 좌표 자동 입력
    map.on("click", (e) => {
      if (!isAddMode) return;

      const lat = Number(e.latlng.lat.toFixed(6));
      const lon = Number(e.latlng.lng.toFixed(6));

      // 미리보기 핀 표시(다시 클릭하면 옮겨짐)
      if (pendingPin) map.removeLayer(pendingPin);
      pendingPin = L.marker([lat, lon]).addTo(map).bindPopup(`선택 좌표<br>${lat}, ${lon}`).openPopup();

      // 가게 정보 입력
      const name = prompt(`가게 이름을 입력하세요\n(좌표: ${lat}, ${lon})`);
      if (!name) return;

      const menu = prompt("메뉴 / 메모를 입력하세요") || "";

      const restaurant = { name, menu, lat, lon };
      restaurants.push(restaurant);
      renderRestaurant(restaurant);

      map.setView([lat, lon], 16);

      // 추가 모드 종료(원하면 계속 추가하도록 바꿀 수도 있음)
      isAddMode = false;
      addBtn.textContent = "➕ 맛집 추가";
      addBtn.style.background = "#1976d2";
      hint.innerHTML = "버튼을 누르면 <b>지도 클릭</b>으로 좌표를 찍을 수 있어요.";

      // 미리보기 핀 제거
      if (pendingPin) {
        map.removeLayer(pendingPin);
        pendingPin = null;
      }
    });
  </script>
</body>
</html>
