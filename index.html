<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맛집 지도 - 첨단 와이어스 파크 중심</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body { display:flex; margin:0; }
    #sidebar{
      width:300px; height:100vh; overflow-y:auto;
      background:#f8f9fa; padding:10px; box-sizing:border-box;
      border-right:1px solid #ddd;
    }
    #map{ flex-grow:1; height:100vh; position:relative; }

    .restaurant{
      cursor:pointer; margin-bottom:10px; padding:8px;
      border-bottom:1px solid #e0e0e0;
    }
    .restaurant b{ display:block; }

    /* 사이드바 힌트 */
    .hint{
      margin:10px 0 14px;
      font-size:12px;
      color:#555;
      padding:10px;
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:12px;
      line-height:1.45;
    }
    .hint b{ color:#1976d2; }

    /* 홈(원위치) 버튼 */
    #homeBtn {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 1000;
      display: none;

      background: #fff;
      border: 1px solid rgba(0,0,0,.2);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,.18);
    }
    #homeBtn:hover { background: #f3f4f6; }

    /* ---- Leaflet control: gear ---- */
    .gear-btn{
      width:34px; height:34px;
      border-radius:10px;
      background:#fff;
      border:1px solid rgba(0,0,0,.15);
      box-shadow:0 2px 10px rgba(0,0,0,.12);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
      user-select:none;
      font-size:18px;
      line-height:1;
    }
    .gear-menu{
      margin-top:8px;
      background:#fff;
      border:1px solid rgba(0,0,0,.15);
      box-shadow:0 2px 12px rgba(0,0,0,.14);
      border-radius:12px;
      overflow:hidden;
      min-width:160px;
      display:none;
    }
    .gear-menu.open{ display:block; }
    .gear-item{
      padding:10px 12px;
      font-size:13px;
      cursor:pointer;
      white-space:nowrap;
    }
    .gear-item:hover{ background:#f3f4f6; }

    /* ---- Modal ---- */
    .modal-backdrop{
      position:fixed; inset:0;
      background:rgba(0,0,0,.35);
      display:none;
      align-items:center; justify-content:center;
      z-index:9999;
      padding:16px;
    }
    .modal-backdrop.open{ display:flex; }
    .modal{
      width:min(520px, 100%);
      background:#fff;
      border-radius:16px;
      box-shadow:0 16px 40px rgba(0,0,0,.25);
      overflow:hidden;
    }
    .modal-header{
      padding:14px 16px;
      border-bottom:1px solid #eee;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .modal-title{ font-weight:700; font-size:15px; }
    .modal-close{
      border:none; background:transparent; cursor:pointer;
      font-size:18px; line-height:1;
      padding:6px 8px;
      border-radius:10px;
    }
    .modal-close:hover{ background:#f3f4f6; }

    .modal-body{ padding:14px 16px; }

    .tabs{
      display:flex;
      gap:8px;
      margin-bottom:12px;
    }
    .tab{
      flex:1;
      padding:10px 10px;
      border-radius:12px;
      border:1px solid #e5e7eb;
      background:#fff;
      cursor:pointer;
      font-size:13px;
      text-align:center;
      user-select:none;
    }
    .tab.active{
      border-color:#1976d2;
      box-shadow:0 0 0 3px rgba(25,118,210,.12);
    }

    .form{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .row{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    @media (max-width: 480px){
      .row{ grid-template-columns: 1fr; }
    }

    label{ font-size:12px; color:#555; display:block; margin-bottom:6px; }
    input, textarea{
      width:100%;
      padding:10px 10px;
      border-radius:12px;
      border:1px solid #e5e7eb;
      outline:none;
      font-size:13px;
      box-sizing:border-box;
      background:#fff;
    }
    textarea{ min-height:74px; resize:vertical; }

    input:focus, textarea:focus{
      border-color:#1976d2;
      box-shadow:0 0 0 3px rgba(25,118,210,.12);
    }

    .helper{
      font-size:12px;
      color:#666;
      line-height:1.4;
      margin-top:-4px;
    }
    .helper b{ color:#2e7d32; }

    .actions{
      display:flex;
      gap:10px;
      margin-top:4px;
    }
    .btn{
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #e5e7eb;
      background:#fff;
      cursor:pointer;
      font-size:13px;
    }
    .btn.primary{
      background:#1976d2;
      border-color:#1976d2;
      color:#fff;
    }
    .btn.success{
      background:#2e7d32;
      border-color:#2e7d32;
      color:#fff;
    }
    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .status{
      margin-top:8px;
      font-size:12px;
      color:#555;
      padding:10px;
      background:#f9fafb;
      border:1px dashed #d1d5db;
      border-radius:12px;
      line-height:1.45;
    }
    .status .ok{ color:#2e7d32; font-weight:700; }
    .status .warn{ color:#d32f2f; font-weight:700; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h3>맛집 리스트</h3>
    <div class="hint" id="hint">
      불러오는 중...
    </div>
  </div>

  <div id="map">
    <button id="homeBtn" type="button">⟲ 원위치</button>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">맛집 추가</div>
        <button class="modal-close" id="modalCloseBtn" aria-label="close">✕</button>
      </div>

      <div class="modal-body">
        <div class="tabs">
          <div class="tab active" id="tabPick">📍 지도에서 찍기</div>
          <div class="tab" id="tabAddr">🏠 주소 입력</div>
        </div>

        <div class="form">
          <div>
            <label for="nameInput">가게명 *</label>
            <input id="nameInput" placeholder="예: 파더스베이글" />
          </div>

          <div>
            <label for="menuInput">설명</label>
            <textarea id="menuInput" placeholder="예: 추천 메뉴, 웨이팅, 가격 등"></textarea>
          </div>

          <div id="addressBlock">
            <label for="addrInput">주소</label>
            <input id="addrInput" placeholder="예: 광주 북구 첨단과기로 208번길 ..." />
            <div class="actions">
              <button class="btn" id="findCoordsBtn" type="button">주소로 좌표찾기</button>
            </div>
            <div class="helper">주소 입력 방식은 <b>좌표찾기</b>를 눌러 위도/경도를 자동 채워요.</div>
          </div>

          <div class="row">
            <div>
              <label for="latInput">위도(lat) *</label>
              <input id="latInput" placeholder="예: 35.222440" inputmode="decimal" />
            </div>
            <div>
              <label for="lonInput">경도(lon) *</label>
              <input id="lonInput" placeholder="예: 126.851701" inputmode="decimal" />
            </div>
          </div>

          <div class="status" id="statusBox">
            <span class="warn">좌표가 필요해요.</span>
            <br/>지도에서 찍기: 아래 버튼 누르고 <b>지도 클릭</b>하면 자동 입력됩니다.
          </div>

          <div class="actions">
            <button class="btn" id="cancelBtn" type="button">취소</button>
            <button class="btn success" id="pickModeBtn" type="button">지도 클릭으로 좌표 찍기</button>
            <button class="btn primary" id="addBtn" type="button">추가</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // -------------------------------
    // Map init
    // -------------------------------
    const restaurants = [];

    const centerLat = 35.2224405;
    const centerLon = 126.8517018;

    const map = L.map("map").setView([centerLat, centerLon], 15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    const sidebar = document.getElementById("sidebar");
    const hint = document.getElementById("hint");

    L.marker([centerLat, centerLon]).bindPopup("<b>첨단 와이어스 파크</b>").addTo(map);

    // ✅ 원위치(홈) 기준값 저장
    const homeCenter = L.latLng(centerLat, centerLon);
    const homeZoom = map.getZoom();
    const homeBtn = document.getElementById("homeBtn");

    homeBtn.addEventListener("click", () => {
      map.setView(homeCenter, homeZoom, { animate: true });
    });

    function updateHomeBtnVisibility() {
      const currentCenter = map.getCenter();
      const currentZoom = map.getZoom();
      const dist = currentCenter.distanceTo(homeCenter);
      const movedAway = dist > 40 || currentZoom !== homeZoom;
      homeBtn.style.display = movedAway ? "block" : "none";
    }
    map.on("moveend zoomend", updateHomeBtnVisibility);
    updateHomeBtnVisibility();

    // -------------------------------
    // Gear control
    // -------------------------------
    const GearControl = L.Control.extend({
      options: { position: "topright" },
      onAdd: function() {
        const wrap = L.DomUtil.create("div");
        wrap.style.position = "relative";

        const btn = L.DomUtil.create("div", "gear-btn", wrap);
        btn.title = "메뉴";
        btn.innerHTML = "⚙️";

        const menu = L.DomUtil.create("div", "gear-menu", wrap);
        menu.innerHTML = `<div class="gear-item" id="menuAdd">🍽️ 맛집 추가</div>`;

        L.DomEvent.disableClickPropagation(wrap);
        L.DomEvent.disableScrollPropagation(wrap);

        btn.addEventListener("click", () => {
          menu.classList.toggle("open");
        });

        document.addEventListener("click", (e) => {
          if (!wrap.contains(e.target)) menu.classList.remove("open");
        });

        menu.querySelector("#menuAdd").addEventListener("click", () => {
          menu.classList.remove("open");
          openModal();
        });

        return wrap;
      }
    });
    map.addControl(new GearControl());

    // -------------------------------
    // Notion API via Vercel (Option A)
    // -------------------------------
    async function fetchRestaurantsFromNotion() {
      const res = await fetch("/api/restaurants", { method: "GET" });
      if (!res.ok) {
        const text = await res.text().catch(() => "");
        throw new Error(text || "Failed to load restaurants");
      }
      const data = await res.json();
      return data.items || [];
    }

    async function addRestaurantToNotion(obj) {
      const res = await fetch("/api/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(obj),
      });
      if (!res.ok) {
        const text = await res.text().catch(() => "");
        throw new Error(text || "Failed to add restaurant");
      }
      return await res.json();
    }

    // -------------------------------
    // Modal elements
    // -------------------------------
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalCloseBtn = document.getElementById("modalCloseBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    const tabPick = document.getElementById("tabPick");
    const tabAddr = document.getElementById("tabAddr");

    const nameInput = document.getElementById("nameInput");
    const menuInput = document.getElementById("menuInput");
    const addrInput = document.getElementById("addrInput");
    const latInput = document.getElementById("latInput");
    const lonInput = document.getElementById("lonInput");

    const addressBlock = document.getElementById("addressBlock");
    const findCoordsBtn = document.getElementById("findCoordsBtn");
    const pickModeBtn = document.getElementById("pickModeBtn");
    const addBtn = document.getElementById("addBtn");
    const statusBox = document.getElementById("statusBox");

    // mode: 'pick' | 'address'
    let mode = "pick";

    // pick mode state
    let isPickArmed = false;
    let pendingPin = null;

    function openModal() {
      modalBackdrop.classList.add("open");
      modalBackdrop.setAttribute("aria-hidden", "false");
      setMode("pick");
      resetFormKeepText(false);
      setStatus();
    }

    function closeModal() {
      modalBackdrop.classList.remove("open");
      modalBackdrop.setAttribute("aria-hidden", "true");
      disarmPick();
    }

    modalCloseBtn.addEventListener("click", closeModal);
    cancelBtn.addEventListener("click", closeModal);

    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    // -------------------------------
    // Mode switching
    // -------------------------------
    function setMode(next) {
      mode = next;

      if (mode === "pick") {
        tabPick.classList.add("active");
        tabAddr.classList.remove("active");

        addressBlock.style.display = "none";
        pickModeBtn.style.display = "inline-block";
      } else {
        tabAddr.classList.add("active");
        tabPick.classList.remove("active");

        addressBlock.style.display = "block";
        pickModeBtn.style.display = "none";
        disarmPick();
      }
      setStatus();
    }

    tabPick.addEventListener("click", () => setMode("pick"));
    tabAddr.addEventListener("click", () => setMode("address"));

    // -------------------------------
    // Rendering / add
    // -------------------------------
    function renderRestaurant(restaurant) {
      const marker = L.circleMarker([restaurant.lat, restaurant.lon], {
        radius: 8,
        fillColor: "#ff0000",
        color: "#000",
        weight: 1,
        opacity: 1,
        fillOpacity: 0.8,
      })
      .bindPopup(
        `<b>${escapeHtml(restaurant.name)}</b><br>${escapeHtml(restaurant.menu || "")}` +
        (restaurant.address ? `<br><small>${escapeHtml(restaurant.address)}</small>` : "")
      )
      .addTo(map);

      const div = document.createElement("div");
      div.className = "restaurant";
      div.innerHTML =
        `<b>${escapeHtml(restaurant.name)}</b>` +
        `<div>${escapeHtml(restaurant.menu || "")}</div>` +
        (restaurant.address ? `<div style="font-size:12px;color:#666;">${escapeHtml(restaurant.address)}</div>` : "");

      div.addEventListener("click", () => {
        map.setView([restaurant.lat, restaurant.lon], 16);
        marker.openPopup();
      });

      sidebar.appendChild(div);
    }

    function clearRenderedListOnly() {
      // sidebar의 "맛집 리스트" + hint는 유지하고, 나머지(리스트 항목)만 제거
      const nodes = Array.from(sidebar.querySelectorAll(".restaurant"));
      nodes.forEach(n => n.remove());
    }

    async function initRestaurants() {
      hint.innerHTML = "📡 노션에서 불러오는 중...";
      try {
        const items = await fetchRestaurantsFromNotion();
        restaurants.length = 0;
        clearRenderedListOnly();
        items.forEach((r) => {
          restaurants.push(r);
          renderRestaurant(r);
        });
        hint.innerHTML = `✅ 불러오기 완료: <b>${items.length}</b>개`;
      } catch (e) {
        console.error(e);
        hint.innerHTML = `⚠️ 노션에서 목록을 불러오지 못했어요.<br/><small>${escapeHtml(String(e.message || e))}</small>`;
      }
    }

    async function addRestaurantObject(obj) {
      // 버튼 중복 클릭 방지
      addBtn.disabled = true;
      addBtn.textContent = "저장 중...";

      try {
        // 1) 노션 저장
        await addRestaurantToNotion(obj);

        // 2) UI 즉시 반영(간단)
        restaurants.push(obj);
        renderRestaurant(obj);
        map.setView([obj.lat, obj.lon], 16);

        closeModal();
        hint.innerHTML = `✅ <b>${escapeHtml(obj.name)}</b> 추가됨! (공유 링크에서도 동일하게 보여요)`;
      } catch (e) {
        console.error(e);
        alert("노션 저장 실패!\n" + (e.message || e));
      } finally {
        addBtn.disabled = false;
        addBtn.textContent = "추가";
      }
    }

    function parseLatLon() {
      const lat = Number(String(latInput.value).trim());
      const lon = Number(String(lonInput.value).trim());
      return { lat, lon, ok: Number.isFinite(lat) && Number.isFinite(lon) };
    }

    addBtn.addEventListener("click", () => {
      const name = String(nameInput.value || "").trim();
      const menu = String(menuInput.value || "").trim();
      const address = String(addrInput.value || "").trim();
      const { lat, lon, ok } = parseLatLon();

      if (!name) {
        alert("가게명을 입력해주세요.");
        nameInput.focus();
        return;
      }
      if (!ok) {
        alert("위도/경도를 올바르게 입력하거나 자동으로 채워주세요.");
        latInput.focus();
        return;
      }

      // category는 지금 폼에 없으니 빈 값으로 (노션 코드가 빈 값이면 무시)
      addRestaurantObject({ name, menu, address, lat, lon, category: "" });
    });

    // -------------------------------
    // Pick on map
    // -------------------------------
    function armPick() {
      isPickArmed = true;
      document.getElementById("map").style.cursor = "crosshair";
      pickModeBtn.textContent = "지도를 클릭해 좌표를 찍어주세요...";
      pickModeBtn.disabled = true;

      setStatus("pick_armed");
    }

    function disarmPick() {
      isPickArmed = false;
      document.getElementById("map").style.cursor = "";
      pickModeBtn.textContent = "지도 클릭으로 좌표 찍기";
      pickModeBtn.disabled = false;

      if (pendingPin) {
        map.removeLayer(pendingPin);
        pendingPin = null;
      }
      setStatus();
    }

    pickModeBtn.addEventListener("click", () => {
      if (mode !== "pick") return;
      armPick();
    });

    map.on("click", (e) => {
      if (!modalBackdrop.classList.contains("open")) return;
      if (mode !== "pick") return;
      if (!isPickArmed) return;

      const lat = Number(e.latlng.lat.toFixed(6));
      const lon = Number(e.latlng.lng.toFixed(6));

      latInput.value = String(lat);
      lonInput.value = String(lon);

      if (pendingPin) map.removeLayer(pendingPin);
      pendingPin = L.marker([lat, lon]).addTo(map).bindPopup(`선택 좌표<br>${lat}, ${lon}`).openPopup();
      map.setView([lat, lon], 16);

      disarmPick();
      setStatus("coords_ok");
    });

    // -------------------------------
    // Address -> coords
    // -------------------------------
    findCoordsBtn.addEventListener("click", async () => {
      const address = String(addrInput.value || "").trim();
      if (!address) {
        alert("주소를 입력해주세요.");
        addrInput.focus();
        return;
      }

      setStatus("geocoding");

      const url =
        "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
        encodeURIComponent(address);

      try {
        const res = await fetch(url, { headers: { "Accept": "application/json" } });
        if (!res.ok) throw new Error("지오코딩 요청 실패");

        const data = await res.json();
        if (!data || data.length === 0) {
          setStatus("geocode_fail");
          alert("해당 주소로 좌표를 찾지 못했어요. 주소를 더 정확히 적어주세요.");
          return;
        }

        const lat = Number(Number(data[0].lat).toFixed(6));
        const lon = Number(Number(data[0].lon).toFixed(6));

        latInput.value = String(lat);
        lonInput.value = String(lon);

        if (pendingPin) map.removeLayer(pendingPin);
        pendingPin = L.marker([lat, lon]).addTo(map).bindPopup(`검색 위치<br>${lat}, ${lon}`).openPopup();
        map.setView([lat, lon], 16);

        setStatus("coords_ok");

      } catch (err) {
        console.error(err);
        setStatus("geocode_fail");
        alert("주소 검색 중 오류가 발생했어요. 잠시 후 다시 시도해 주세요.");
      }
    });

    // -------------------------------
    // Form helpers
    // -------------------------------
    function resetFormKeepText(keep) {
      if (!keep) {
        nameInput.value = "";
        menuInput.value = "";
        addrInput.value = "";
      }
      latInput.value = "";
      lonInput.value = "";
      if (pendingPin) { map.removeLayer(pendingPin); pendingPin = null; }
      disarmPick();
    }

    function setStatus(state) {
      const { ok } = parseLatLon();
      const isOpen = modalBackdrop.classList.contains("open");
      if (!isOpen) return;

      if (state === "geocoding") {
        statusBox.innerHTML = `🔎 주소로 좌표 찾는 중...`;
        return;
      }
      if (state === "geocode_fail") {
        statusBox.innerHTML = `<span class="warn">주소 검색 실패</span><br/>주소를 더 자세히 입력해 주세요.`;
        return;
      }
      if (state === "pick_armed") {
        statusBox.innerHTML = `📍 <b>지도를 클릭</b>하면 위도/경도가 자동 입력됩니다.`;
        return;
      }
      if (state === "coords_ok" || ok) {
        statusBox.innerHTML = `<span class="ok">좌표 준비 완료</span><br/>이제 <b>추가</b>를 누르면 노션 DB에 저장됩니다.`;
        return;
      }

      if (mode === "pick") {
        statusBox.innerHTML = `<span class="warn">좌표가 필요해요.</span><br/>아래 <b>지도 클릭으로 좌표 찍기</b>를 누른 뒤 지도에서 위치를 클릭하세요.`;
      } else {
        statusBox.innerHTML = `<span class="warn">좌표가 필요해요.</span><br/>주소 입력 후 <b>주소로 좌표찾기</b>를 눌러주세요.`;
      }
    }

    [latInput, lonInput].forEach((el) => el.addEventListener("input", () => setStatus()));

    // -------------------------------
    // Escape HTML
    // -------------------------------
    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    // -------------------------------
    // Start: load from Notion
    // -------------------------------
    initRestaurants();
  </script>
</body>
</html>
